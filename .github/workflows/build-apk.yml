name: Build APK (Production)

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.github/workflows/update-research.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: false
        default: ''
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME 2>&1 | head -20
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --version
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed 2>&1 | head -20
          echo "SDK ready"

      - name: Prepare DB for Android
        run: |
          mkdir -p app/src/main/assets/databases
          if [ -f "tafsir.db.gz" ]; then cp tafsir.db.gz app/src/main/assets/databases/; fi
          mkdir -p android/app/src/main/assets/databases 2>/dev/null || true
          if [ -f "tafsir.db.gz" ]; then cp tafsir.db.gz android/app/src/main/assets/databases/ 2>/dev/null || true; fi
          ls -lh app/src/main/assets/databases/ 2>&1 | head -5

      - name: Install Capacitor
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          npx cap --version

      - name: Prepare www
        run: |
          mkdir -p www
          cp -r index.html assets chapters part*.html manifest.json sw.js vocabulary.html 404.html www/ 2>&1 | head -20
          ls -lh www/ 2>&1 | head -20
          echo "www ready"

      - name: Init Capacitor (if needed)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          cat capacitor.config.json
          ls -la android/ 2>&1 | head -20

      - name: Fix Kotlin duplicates
        run: |
          # Fix duplicate kotlin-stdlib issue - exclude old jdk7/jdk8 modules
          echo "Fixing Kotlin duplicates..."
          # Add resolutionStrategy to android/build.gradle
          if ! grep -q "kotlin-stdlib-jdk" android/build.gradle 2>/dev/null; then
            cat >> android/build.gradle <<'GRADLE'
          // Fix duplicate Kotlin classes
          subprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          GRADLE
          fi
          cat android/build.gradle | tail -20

      - name: Sync web assets
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/

      - name: Build Release APK (unsigned)
        if: github.event_name == 'release' || inputs.release_tag != ''
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
          ls -lh app/build/outputs/apk/release/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Scientific-Tafsir-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: Scientific-Tafsir-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90

      - name: Create GitHub Release (on push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}
          name: "Auto Build ${{ github.run_number }}"
          body: |
            Production APK — auto build from main
            - Responsive PWA inside WebView
            - Manifest + Service Worker + Notifications
            - Bilingual EN/BN/AR, 114 surahs, offline
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach to Manual Release
        if: inputs.release_tag != '' || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
