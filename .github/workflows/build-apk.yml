name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Setup Android SDK (fallback)
        if: failure()
        run: |
          echo "Fallback SDK setup"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Prepare DB for Android
        run: |
          mkdir -p app/src/main/assets/databases
          if [ -f "tafsir.db.gz" ]; then cp tafsir.db.gz app/src/main/assets/databases/; fi
          mkdir -p android/app/src/main/assets/databases 2>/dev/null || true
          if [ -f "tafsir.db.gz" ]; then cp tafsir.db.gz android/app/src/main/assets/databases/ 2>/dev/null || true; fi
          ls -lh app/src/main/assets/databases/ 2>&1 | head -5
          ls -lh android/app/src/main/assets/databases/ 2>&1 | head -5 || echo "android assets not yet created (will be after cap add)"

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "./gradlew" ]; then chmod +x ./gradlew; fi
          if [ -f "./android/gradlew" ]; then chmod +x ./android/gradlew; fi

      - name: Build Release APK
        run: |
          if [ -f "./gradlew" ]; then ./gradlew assembleRelease; else cd android && ./gradlew assembleRelease; fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
