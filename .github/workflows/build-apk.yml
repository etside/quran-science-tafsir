name: Build APK (Production)

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', '.github/workflows/update-research.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: false
        default: ''
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (manual)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "SDK installed"

      - name: Install Capacitor
        run: |
          npm init -y || true
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          npx cap --version

      - name: Prepare www
        run: |
          mkdir -p www
          cp -r index.html assets chapters part*.html manifest.json sw.js vocabulary.html 404.html www/ 2>&1 | head -20
          ls -lh www/ 2>&1 | head -20
          echo "www ready"

      - name: Init Capacitor (if needed)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          cat capacitor.config.json
          ls -la android/ 2>&1 | head -20

      - name: Sync web assets
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/

      - name: Build Release APK (unsigned)
        if: github.event_name == 'release' || inputs.release_tag != ''
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace
          ls -lh app/build/outputs/apk/release/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Scientific-Tafsir-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        if: github.event_name == 'release' || inputs.release_tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: Scientific-Tafsir-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90

      - name: Create GitHub Release (on push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}
          name: "Auto Build ${{ github.run_number }}"
          body: |
            Production APK — auto build from main
            - Responsive PWA inside WebView
            - Manifest + Service Worker + Notifications
            - Bilingual EN/BN/AR, 114 surahs, offline
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach to Manual Release
        if: inputs.release_tag != '' || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
