<!-- Hyperframes composition: Seven Heavens — layered universe (Q 2:29, 67:3) -->
<div data-composition-id="seven-heavens" data-width="1280" data-height="720" data-duration="8" style="width:100%;height:100%;background:#0d1b2a;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden">
  <style>
    .heaven{position:absolute;border:1px solid rgba(212,175,55,0.3);border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(212,175,55,0.9);font-size:10px;letter-spacing:1px}
    .core{width:40px;height:40px;background:radial-gradient(circle, #d4af37, #8a6d1b);border-radius:50%;position:absolute;z-index:10}
    .label{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;color:#9fb3c8}
  </style>
  <div class="core" data-track-index="0"><div class="label">Earth</div></div>
  <div class="heaven clip" data-track-index="1" data-start="0.3" data-duration="1.2" style="width:120px;height:120px;"><div class="label">1st Heaven</div></div>
  <div class="heaven clip" data-track-index="2" data-start="0.8" data-duration="1.2" style="width:200px;height:200px;"><div class="label">2nd</div></div>
  <div class="heaven clip" data-track-index="3" data-start="1.3" data-duration="1.2" style="width:280px;height:280px;"><div class="label">3rd</div></div>
  <div class="heaven clip" data-track-index="4" data-start="1.8" data-duration="1.2" style="width:360px;height:360px;"><div class="label">4th</div></div>
  <div class="heaven clip" data-track-index="5" data-start="2.3" data-duration="1.2" style="width:440px;height:440px;"><div class="label">5th</div></div>
  <div class="heaven clip" data-track-index="6" data-start="2.8" data-duration="1.2" style="width:520px;height:520px;"><div class="label">6th</div></div>
  <div class="heaven clip" data-track-index="7" data-start="3.3" data-duration="1.2" style="width:600px;height:600px;"><div class="label">7th Heaven</div></div>
  <div class="clip" data-track-index="8" data-start="5" data-duration="2" style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(22,40,59,0.9);border:1px solid #24405c;border-radius:8px;padding:8px 14px;color:#e8eef5;font-size:11px;text-align:center">Seven Samawat — layered cosmos · Quran 2:29, 67:3<br><span style="color:#9fb3c8;font-size:9px">Modern: atmospheric layers, magnetosphere, cosmic web — layered structures</span></div>
  <script>
    window.__timelines=window.__timelines||{};
    const tl=gsap.timeline({paused:true});
    document.querySelectorAll('.heaven').forEach((el,i)=>{
      tl.fromTo(el,{scale:0,opacity:0},{scale:1,opacity:1,duration:0.8,ease:"back.out(1.2)"}, i*0.4+0.3);
    });
    tl.fromTo('.core',{scale:0},{scale:1,duration:0.6,ease:"back.out(1.5)"},0);
    window.__timelines["seven-heavens"]=tl;
  </script>
</div>
